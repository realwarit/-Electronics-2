<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ติวสอบ อิเล็กทรอนิกส์วิศวกรรม 2</title>
<meta name="description" content="เว็บติวสอบวิชาอิเล็กทรอนิกส์วิศวกรรม 2: Cathodic protection, AVR, วงจรแอร์ inverter, วงจรเรียงกระแสสามเฟส, MOSFET/IGBT, SCR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500&family=Sarabun:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23BFD7F2'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H34z' fill='%232C5C90'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FBF8F1; --bg2:#F4EFE3; --card:#FFFDF8; --card2:#F7F2E8; --ink:#2B3A55; --ink2:#5D6A84; --ink3:#8A94A8;
  --line:#E8E0CF; --pri:#8FB8E8; --pri2:#BFD7F2; --pri3:#E3EEFA; --pri-ink:#2C5C90;
  --mint:#D7EFE3; --mint-ink:#2D7A57; --coral:#F8DCD8; --coral-ink:#A2453B;
  --warn:#FFF2DF; --warn-line:#EFC78E; --warn-ink:#8A5A12; --hot:#FBE8EE; --hot-ink:#9C3F5E;
  --tip:#E6F3EC; --tip-ink:#2F6E52; --sky:#E4EEF8;
  --shadow:0 1px 2px rgba(43,58,85,.05),0 4px 14px rgba(43,58,85,.06);
  --r:16px; --hf:'Kanit','Mitr',system-ui,sans-serif; --bf:'Sarabun','IBM Plex Sans Thai Looped','Leelawadee UI','Thonburi',system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1D293C; --bg2:#22304A; --card:#26354E; --card2:#2C3D59; --ink:#E5ECF6; --ink2:#B2BFD3; --ink3:#8594AE;
  --line:#3A4D6B; --pri:#8FB8E8; --pri2:#3D5E8A; --pri3:#2F4A6E; --pri-ink:#AFCFF3;
  --mint:#24493E; --mint-ink:#9CDDBD; --coral:#4E3036; --coral-ink:#F2B4AC;
  --warn:#433A2A; --warn-line:#8C7040; --warn-ink:#F2D29A; --hot:#45303D; --hot-ink:#F0B5CA;
  --tip:#29453D; --tip-ink:#A9DEC3; --sky:#2B4060;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.hf{font-family:var(--hf);font-weight:500;line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pri-ink)}
sub,sup{line-height:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--hf);font-size:17px;background:none;border:0;padding:0;text-align:left;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:11px;background:var(--pri2);display:grid;place-items:center;font-size:17px;flex:none}
.brand span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.iconbtn:hover{border-color:var(--pri)}
/* hero */
.hero{margin:22px 0 18px;padding:26px 24px;border-radius:24px;background:linear-gradient(135deg,var(--pri3),var(--card) 70%);border:1px solid var(--line);position:relative;overflow:hidden}
.hero>*:not(.deco):not(.deco2){position:relative;z-index:1}
.hero h1{font-size:clamp(26px,4.6vw,38px);color:var(--ink)}
.hero .sub{color:var(--ink2);margin-top:2px;font-size:16px}
.hero .deco{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;background:var(--pri2);opacity:.45}
.hero .deco2{position:absolute;right:70px;top:60px;width:60px;height:60px;border-radius:50%;background:var(--mint);opacity:.7}
.steps3{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 14px;position:relative}
.steps3 .st{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;font-family:var(--hf);font-size:15px}
.steps3 .st b{background:var(--pri);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px;font-weight:500}
.steps3 .arr{align-self:center;color:var(--ink3)}
.badges{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;line-height:1.4;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.bdg.hot{background:var(--hot);border-color:transparent;color:var(--hot-ink)}
.bdg.mint{background:var(--mint);border-color:transparent;color:var(--mint-ink)}
.bdg.sky{background:var(--sky);border-color:transparent;color:var(--pri-ink)}
/* progress + actions */
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.prog .row{display:flex;gap:14px;flex-wrap:wrap}
.stat{flex:1;min-width:130px;background:var(--card2);border-radius:14px;padding:12px 14px}
.stat .k{font-size:13.5px;color:var(--ink2)}
.stat .v{font-family:var(--hf);font-size:28px;line-height:1.2}
.stat .v small{font-size:15px;color:var(--ink2)}
.bar{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:999px;transition:width .4s}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:11px 16px;font-family:var(--hf);font-size:16px;line-height:1.3;transition:transform .12s,border-color .15s,background .15s;text-align:center}
.btn:hover{border-color:var(--pri)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#16304F}
.btn.pri:hover{background:#7FAEE4}
.btn.soft{background:var(--pri3);border-color:transparent;color:var(--pri-ink)}
.btn.mint{background:var(--mint);border-color:transparent;color:var(--mint-ink)}
.btn.big{padding:15px 18px;font-size:17px}
.btn.sm{padding:7px 12px;font-size:14.5px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .hint{font-family:var(--bf);font-size:13px;opacity:.8;font-weight:400}
/* mode switch */
.secthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 12px}
.secthead h2{font-size:22px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 13px;border-radius:10px;font-family:var(--hf);font-size:14.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* chapter list */
.chlist{display:flex;flex-direction:column;gap:12px}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px}
.ch .num{width:54px;height:54px;border-radius:16px;background:var(--pri3);color:var(--pri-ink);display:grid;place-items:center;font-family:var(--hf);font-size:21px}
.ch.star .num{background:var(--pri2)}
.ch h3{font-size:18px}
.ch .en{font-size:13.5px;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:13px;line-height:1.4;padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.ch .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch .go{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ch .go .cnt{font-size:13px;color:var(--ink3)}
.starb{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--warn);color:var(--warn-ink);font-family:var(--hf);white-space:nowrap}
.donechk{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--mint);color:var(--mint-ink)}
/* reading */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.readhead{margin:6px 0 16px}
.readhead h1{font-size:clamp(24px,4vw,32px)}
.readhead .en{color:var(--ink2)}
.readbody{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px clamp(16px,3.4vw,34px);box-shadow:var(--shadow)}
.rsec{margin:4px 0 22px}
.rsec h3{font-size:20px;margin:6px 0 10px;padding-left:12px;border-left:4px solid var(--pri)}
.readbody p{margin:.5em 0}
.readbody ul,.readbody ol{padding-left:1.4em;margin:.4em 0}
.readbody li{margin:.25em 0}
ol.steps{counter-reset:s;list-style:none;padding-left:0}
ol.steps>li{counter-increment:s;position:relative;padding-left:40px;margin:.5em 0}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:2px;width:27px;height:27px;border-radius:50%;background:var(--pri3);color:var(--pri-ink);font-family:var(--hf);font-size:14px;display:grid;place-items:center}
.hl{background:var(--pri3);border-radius:12px;padding:10px 14px}
.box{border-radius:16px;margin:16px 0;border:1px solid transparent;overflow:hidden}
.box-h{font-family:var(--hf);font-size:15.5px;padding:9px 14px 0;display:flex;align-items:center;gap:8px}
.box-i{font-size:16px}
.box-b{padding:6px 16px 13px}
.box-b p:first-child{margin-top:0}
.box.vocab{background:var(--card2);border-color:var(--line)}
.box.vocab dl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 16px;margin:4px 0}
.box.vocab dt{font-weight:600;color:var(--pri-ink)}
.box.vocab dd{margin:0;color:var(--ink2)}
.box.formula{background:var(--sky);color:var(--ink)}
.box.formula .box-h{color:var(--pri-ink)}
.box.example{background:var(--card2);border:1px dashed var(--ink3)}
.box.tip{background:var(--tip)}
.box.tip .box-h{color:var(--tip-ink)}
.box.hot{background:var(--hot)}
.box.hot .box-h{color:var(--hot-ink)}
.box.warn{background:var(--warn);border-color:var(--warn-line)}
.box.warn .box-h{color:var(--warn-ink)}
.box.note{background:var(--pri3)}
.box.note .box-h{color:var(--pri-ink)}
.ftbl{border-collapse:collapse;width:100%}
.ftbl td{padding:4px 8px 4px 0;vertical-align:top}
.ftbl td:first-child{white-space:nowrap;font-weight:600;padding-right:14px}
.tblwrap{overflow-x:auto;margin:10px 0;border-radius:12px;border:1px solid var(--line)}
table.tbl{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.55;background:var(--card)}
table.tbl th{background:var(--card2);font-family:var(--hf);font-weight:500;text-align:left}
table.tbl th,table.tbl td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}
table.tbl.small{font-size:14.5px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0}
.flow span{background:var(--pri3);color:var(--ink);border-radius:12px;padding:7px 11px;font-size:14.5px;line-height:1.4;text-align:center}
.flow b{color:var(--ink3);font-weight:400}
pre.ascii{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;font-size:13px;line-height:1.5;font-family:ui-monospace,'Sarabun',monospace;margin:10px 0}
.fig{margin:14px 0;text-align:center}
.fig figcaption{font-size:13.5px;color:var(--ink3);margin-top:4px}
svg.dia{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
svg .bx{fill:var(--card);stroke:var(--line);stroke-width:1.5}
svg .bx.k{fill:var(--card2)}
svg .bx.p{fill:var(--pri3);stroke:var(--pri)}
svg .bx.s{fill:var(--mint);stroke:transparent}
svg .bx.w{fill:var(--warn);stroke:var(--warn-line)}
svg .sea{fill:var(--sky);stroke:var(--pri)}
svg .tx{fill:var(--ink);font-family:var(--bf);font-size:13.5px}
svg .tx.sm{font-size:11.5px;fill:var(--ink2)}
svg .tx.acc,svg .acc.tx{fill:var(--pri-ink)}
svg .ln{stroke:var(--ink2);stroke-width:1.6;fill:none}
svg .ln.acc{stroke:var(--pri-ink);stroke-dasharray:5 4}
svg .ln.dash{stroke-dasharray:4 4;stroke:var(--ink3)}
svg .ln.bus{stroke:var(--pri-ink);stroke-width:4}
svg .ahd{fill:var(--ink2)}
svg .dio{fill:var(--pri2);stroke:var(--ink2);stroke-width:1.2}
svg .dot{fill:var(--ink2)}
svg .ax{stroke:var(--ink3);stroke-width:1}
svg .wa,svg .wb,svg .wc{fill:none;stroke-width:1.2;opacity:.55}
svg .wa{stroke:#E07A5F} svg .wb{stroke:#5B8DD6} svg .wc{stroke:#4FA37C}
svg .wo{fill:none;stroke:var(--ink);stroke-width:2.4}
.readfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin:18px 0 40px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin:18px 0 8px;flex-wrap:wrap}
.qtop .lab{font-family:var(--hf);font-size:15px;color:var(--ink2)}
.qtop .sp{flex:1}
.streak{font-family:var(--hf);font-size:14.5px;padding:4px 12px;border-radius:999px;background:var(--bg2);color:var(--ink2);transition:transform .2s}
.streak.on{background:var(--warn);color:var(--warn-ink)}
.streak.bump{transform:scale(1.15)}
.pbar{height:10px;background:var(--bg2);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:999px;transition:width .35s}
.qcard{margin:16px 0;padding:22px clamp(16px,3vw,28px)}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtext{font-size:19px;line-height:1.65;font-family:var(--bf);font-weight:600;margin:4px 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-family:var(--bf);font-size:16.5px;line-height:1.55;transition:border-color .15s,background .15s,transform .12s}
.opt:hover{border-color:var(--pri)}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--bg2);display:grid;place-items:center;font-family:var(--hf);font-size:14px;color:var(--ink2)}
.opt.ok{background:var(--mint);border-color:var(--mint-ink);color:var(--ink)}
.opt.ok .k{background:var(--mint-ink);color:var(--card)}
.opt.bad{background:var(--coral);border-color:var(--coral-ink)}
.opt.bad .k{background:var(--coral-ink);color:var(--card)}
.opt.dim{opacity:.7}
.opts.done .opt{cursor:default}
.explain{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--card2);border:1px solid var(--line);animation:fadeup .25s ease}
.explain .verdict{font-family:var(--hf);font-size:17px;margin-bottom:6px}
.explain .verdict.ok{color:var(--mint-ink)} .explain .verdict.bad{color:var(--coral-ink)}
.explain ul{margin:6px 0 0;padding-left:1.2em}
.explain li{margin:.3em 0;font-size:15.5px;line-height:1.6}
.explain li .o{font-weight:600}
.qnav{display:flex;justify-content:space-between;gap:10px;margin:6px 0 40px;flex-wrap:wrap}
.kbd{font-size:12.5px;color:var(--ink3)}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.shake{animation:shake .32s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spark{position:fixed;pointer-events:none;z-index:60;font-size:18px;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
/* result */
.res-hero{text-align:center;padding:26px 18px}
.ring{width:150px;height:150px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--bg2) 0)}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--hf);font-size:30px;line-height:1.1}
.ring small{display:block;font-size:14px;color:var(--ink2)}
.bych{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.bych .r{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 10px;align-items:center;font-size:15px}
.bych .r .bar{grid-column:1/-1;margin:0}
.wronglist{display:flex;flex-direction:column;gap:12px}
.wrong{padding:14px 16px}
.wrong .q{font-weight:600;margin-bottom:6px}
.wrong .a{color:var(--mint-ink)} .wrong .y{color:var(--coral-ink)}
/* written */
.wq{padding:18px;margin-bottom:14px}
.wq .qh{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.wq .qt{font-weight:600;font-size:17px;margin:6px 0 10px}
.wq textarea{width:100%;min-height:150px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink);font:inherit;font-size:16px;line-height:1.7;padding:12px 14px}
.wq textarea:focus{outline:none;border-color:var(--pri)}
.wq .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.wq .saved{font-size:13px;color:var(--ink3)}
.kwc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw{font-size:13.5px;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--ink3);border:1px solid var(--line);transition:all .2s}
.kw.hit{background:var(--mint);color:var(--mint-ink);border-color:transparent}
.model{margin-top:12px;background:var(--tip);border-radius:14px;padding:12px 16px;animation:fadeup .25s}
.model .h{font-family:var(--hf);color:var(--tip-ink);margin-bottom:4px}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.filter button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;font-family:var(--hf)}
.filter button.on{background:var(--pri2);border-color:var(--pri);color:var(--ink)}
/* flashcards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:40px}
.fc{perspective:900px;height:170px;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.fc .f{background:var(--card);font-family:var(--hf);font-size:18px;line-height:1.4}
.fc .b{background:var(--pri3);transform:rotateY(180deg);font-size:15px;line-height:1.55}
.fc .f small{position:absolute;bottom:8px;left:0;right:0;font-size:11.5px;color:var(--ink3);font-family:var(--bf)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.empty{color:var(--ink3);text-align:center;padding:30px}
footer{color:var(--ink3);font-size:13.5px;text-align:center;padding:20px 0 40px}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.warnall .box{margin:12px 0}

// --- รูปคลื่นเรียงกระแส 3 เฟส ---
function waveSVG(kind, W, x0, y0) {
  const A = 46, cyc = 1.5, sc = kind === 'y' ? A : A * 0.58;
  const X = t => x0 + t / (2 * Math.PI * cyc) * (W - 20);
  const ph = [0, -2 * Math.PI / 3, 2 * Math.PI / 3];
  let out = '', paths = ['', '', ''], env = ''; const N = 300;
  for (let i = 0; i <= N; i++) {
    const t = i / N * 2 * Math.PI * cyc; const v = ph.map(p => Math.sin(t + p));
    v.forEach((vv, k) => { paths[k] += (i ? 'L' : 'M') + X(t).toFixed(1) + ',' + (y0 - sc * vv).toFixed(1); });
    const o = kind === 'y' ? Math.max(...v) : (Math.max(...v) - Math.min(...v));
    env += (i ? 'L' : 'M') + X(t).toFixed(1) + ',' + (y0 - sc * o).toFixed(1);
  }
  ['wa', 'wb', 'wc'].forEach((c, k) => out += `<path d="${paths[k]}" class="${c}"/>`);
  out += `<path d="${env}" class="wo"/><line x1="${x0}" y1="${y0}" x2="${x0 + W - 10}" y2="${y0}" class="ax"/><line x1="${x0}" y1="${y0 - 70}" x2="${x0}" y2="${y0 + 52}" class="ax"/>`;
  out += S.t(x0 + W - 12, y0 + 16, 'ωt', 'tx sm', 'end');
  out += S.t(x0 + 6, y0 - 74, kind === 'y' ? 'เส้นหนา v_o = เฟสที่สูงที่สุดขณะนั้น (3 พัลส์/รอบ)' : 'เส้นหนา v_o = แรงดันระหว่างสายที่สูงที่สุด (6 พัลส์/รอบ)', 'tx sm acc', 'start');
  return out;
}

CH.push({
  id: 'cp', star: true,
  title: 'Cathodic Protection (ICCP) และวงจรจ่ายไฟ',
  en: 'Impressed Current Cathodic Protection',
  kw: ['Anodic / Cathodic area', 'Fe(OH)₃ = สนิม', 'Insulated anode (Pb, Pt-Ti)', 'Reference electrode', '450→250 / 600→800 mV', 'Thyristor controller', '600 A @ 8 V'],
  read: `
${SEC('1. ทำไมตัวเรือถึงผุ (Natural corrosive action)', `
<p>ผิวตัวเรือแต่ละจุดมี <b>ศักย์ไฟฟ้า (electric potential)</b> ต่างกันนิดหน่อย จุดที่ศักย์ต่างกันนี้ทำให้เกิด <b>กระแสกัดกร่อน (corrosive current)</b> ไหลวนระหว่างจุดเหล่านั้น โดยมีน้ำทะเลเป็นตัวกลาง (electrolyte)</p>
<p><b>สาเหตุที่ศักย์ต่างกัน</b> (ตำรา 5.4): โลหะต่างชนิดกัน, เนื้อเหล็กแผ่น/รอยเชื่อมไม่สม่ำเสมอ, ความหนาและคุณภาพสีไม่เท่ากัน, อุณหภูมิน้ำ, ความเค็ม (salinity) และปริมาณอากาศในน้ำ (aeration) ทำให้บางจุดเป็น <b>anodic (ขั้วบวก)</b> บางจุดเป็น <b>cathodic (ขั้วลบ)</b></p>
<ol class="steps">
<li><b>ที่ anodic area:</b> อิเล็กตรอนวิ่งออกจากเหล็กผ่านตัวเรือไปหา cathode เหลือ <b>ไอออนเหล็กประจุบวก (Fe⁺)</b> ไว้</li>
<li><b>ที่ cathodic area:</b> อิเล็กตรอนมาถึง ทำให้น้ำทะเลแตกตัว (electrolysis) ได้ <b>ไฮดรอกซิลไอออน OH⁻</b></li>
<li>OH⁻ วิ่งผ่านน้ำทะเลไปที่ anodic area แล้วรวมกับไอออนเหล็ก ได้ <b>Fe(OH)₂ (ferrous hydroxide)</b></li>
<li>Fe(OH)₂ ถูกออกซิเจนในน้ำออกซิไดซ์ต่อ ได้ <b>Fe(OH)₃ (ferric hydroxide) = สนิม</b></li>
</ol>
<p>สรุป: <b>จุด anode ถูกกินจนผุ ส่วนจุด cathode ไม่ผุ</b></p>
`)}
${TIP('<b>"แอโนดหาย แคโทดรอด"</b> — ใครเป็น anode คนนั้นเสียเนื้อ ดังนั้นถ้าอยากให้ตัวเรือรอด ต้องบังคับให้ <u>ทั้งลำ</u> เป็น cathode<br>ลำดับสนิม: Fe⁺ + OH⁻ → Fe(OH)<sub>2</sub> → (+O₂) → Fe(OH)<sub>3</sub> สนิม (เลข 2 มาก่อน 3)')}
${SEC('2. Impressed Current Cathodic Protection (ICCP) แก้ยังไง', `
<p>ทำให้ <b>ทั้งลำเรือเป็น cathode</b>: ให้อิเล็กตรอน "เข้า" มาที่ผิวเรือได้ (เกิด OH⁻) แต่ <b>ไม่มีอิเล็กตรอนออกจากตัวเรือ</b> → เหล็กไม่แตกตัวเป็นไอออน → ไม่ผุ</p>
<p>วิธีทำ: ติด <b>แอโนดหุ้มฉนวน (insulated anode)</b> ทำจาก <b>ตะกั่ว (lead)</b> หรือ <b>platinised titanium</b> ไว้ที่ตัวเรือ แล้วจ่าย <b>ไฟ DC ขั้วบวกเข้าแอโนด</b> เทียบกับตัวเรือ (ตัวเรือต่อขั้วลบ)</p>
<p>OH⁻ จะวิ่งไปที่แอโนดตะกั่วแทน ทำให้ผิวตะกั่วเปลี่ยนเป็น <b>lead peroxide (PbO₂)</b> สีน้ำตาลเข้ม (เหมือนแผ่นบวกแบตตะกั่ว-กรด) พอผิว PbO₂ เกิดแล้วปฏิกิริยาจะลดลง แอโนดใช้ได้ราว <b>7–10 ปี</b></p>
<p>ศักย์ที่จ่ายต้อง "พอดีแค่ชนะ" กระแสกัดกร่อนเดิม เรียกกระแสนี้ว่า <b>impressed protection current</b></p>
`)}
${HOT('ถ้า<b>กระแสป้องกันมากเกินไป</b> → OH⁻ เกิดมากขึ้น → <b>สีกันเพรียง (anti-fouling paint) พองเป็นฟองน้ำ (sponginess) และหลุดลอก (flaking)</b> จึงต้องคุมกระแสอย่างแม่นยำ (critically controlled)')}
${SEC('3. Reference electrode (ขั้ววัดอ้างอิง)', `
<p>ทำจาก <b>สังกะสี (zinc)</b> หรือ <b>เงิน (silver)</b> ติดใต้แนวน้ำ <b>หุ้มฉนวนแยกจากตัวเรือ</b> มีหน้าที่ <b>วัดศักย์</b> อย่างเดียว ไม่ได้จ่ายกระแส (ต่างจาก main anode ที่จ่ายกระแส)</p>

<li><b>ภาคเปรียบเทียบ/ขยาย Error:</b> Op-amp หรือ PID controller</li>
<li><b>ภาคขับ (Driver):</b> สร้างสัญญาณ PWM หรือมุมจุดชนวน SCR</li>
<li><b>ภาคกำลัง (Power stage):</b> SCR/MOSFET/IGBT + <b>Freewheeling diode</b></li>
<li><b>แหล่งจ่ายภายใน:</b> แปลงไฟจาก PMG/AREP/ขั้วเอาต์พุตให้วงจรใช้</li>
<li><b>วงจรป้องกัน:</b> Under-Frequency Roll-Off (UFRO), Over-excitation, Over-voltage, ฟิวส์</li>
<li><b>ตัวปรับตั้ง (Potentiometer):</b> <b>Volts</b> = ปรับแรงดันเป้าหมาย · <b>Stability</b> = ปรับความเสถียร กันแรงดันแกว่ง (hunting) · <b>Droop</b> = ให้แรงดันลดตามโหลดรีแอกทีฟ เพื่อแบ่งโหลดตอนขนาน · <b>UFRO</b> = ตั้งจุดเริ่มลดแรงดันเมื่อความถี่ต่ำ</li>
<li><b>ขั้วต่อภายนอก:</b> Remote voltage adjust, CT input สำหรับ droop, ขั้ว <b>F+/F−</b> ไปขดลวดสนาม</li></ol>`)}

${SEC('7. ฟังก์ชันพิเศษที่พบบ่อย', `<ul><li><b>UFRO (Under-Frequency Roll-Off):</b> รอบเครื่องตก (เช่นโหลดกระชาก) → AVR <b>ลดแรงดันตามความถี่</b> ช่วยลดภาระเครื่องยนต์ให้ฟื้นเร็ว และกันขดลวดร้อนเกิน</li>

<li><b>Soft start:</b> ค่อย ๆ เพิ่มแรงดันตอนสตาร์ท ไม่ให้ overshoot</li></ul>`)}

// helper สร้างข้อคำนวณ: ตัดช้อยส์ที่ซ้ำกันออกอัตโนมัติ
function CQ(q, ans, unit, why, wrongs, dp = 2) {
  const fmt = v => fx(v, dp) + (unit ? ' ' + unit : '');
  const opts = [[fmt(ans), why]]; const vals = [ans];
  const far = v => isFinite(v) && v > 0 && vals.every(u => Math.abs(v - u) / u > 0.03);
  const fallback = [[ans * Math.SQRT2, 'คูณ √2 เกินมา'], [ans / Math.sqrt(3), 'หาร √3 โดยไม่จำเป็น'], [ans * 2, 'คิดซ้ำสองเท่า'], [ans / 2, 'คิดแค่ครึ่งเดียว']];
  for (const [v, w] of [...wrongs, ...fallback]) { if (opts.length >= 4) break; if (far(v)) { vals.push(v); opts.push([fmt(v), w]); } }
  return [q, ...opts];
}

${WARN('ประโยค "ต่างเฟสกัน 1 คลื่นไซน์" ในหน้า 01', 'สไลด์เขียนว่าไฟ 1 เฟส "ต่างเฟสกัน 1 คลื่นไซน์" ซึ่งอ่านแล้วงง ความหมายที่ถูกคือ <b>ไฟ 1 เฟสมีคลื่นไซน์ชุดเดียว</b> (ไม่มีมุมต่างเฟสระหว่างสาย) ส่วนไฟ 3 เฟสมี 3 ชุดต่างกัน 120°')}
${SEC('2. Static Phase Converter (ตัวแปลงเฟสแบบสถิต)', `<p>ใช้ไฟ 1 เฟสจริง 2 เส้น (L1-L2) เป็นฐาน แล้ว "สร้างเฟสที่ 3" ด้วย <b>ตัวเก็บประจุ (Capacitor)</b> ซึ่งทำให้ <b>กระแสนำหน้าแรงดัน 90°</b></p>
<pre class="ascii">L1 (ไฟเข้า) ────────────┬──── สายเข้ามอเตอร์ (T1)
N/L2 (ไฟเข้า) ──────────┼──── สายเข้ามอเตอร์ (T2)
              ┌─────────┴─────────┐
              │  Capacitor Bank   │
              │ (Run + Start Cap) │
              └─────────┬─────────┘
                        └──── สายเข้ามอเตอร์ (T3) = เฟสจำลอง</pre>
<ol class="steps"><li>จ่ายไฟ 1 เฟสเข้า T1-T2</li>
<li>ขณะสตาร์ท กระแสผ่านทั้ง <b>Run + Start Capacitor</b> สร้างสนามแม่เหล็กหมุนเริ่มต้นให้มอเตอร์หมุนได้</li>
<li>มอเตอร์เร่งความเร็วขึ้น <b>Back EMF</b> จากขดลวดที่ 3 ช่วยสร้างเฟสที่ 3 เอง (<b>Self-generation</b>)</li>
<li><b>Relay ตัด Start Capacitor ออก</b> เหลือ <b>Run Capacitor</b> ทำงานต่อเนื่อง</li></ol>`)}
${SEC('3. Rotary Phase Converter (ตัวแปลงเฟสแบบหมุน)', `<p>ใช้ <b>มอเตอร์เหนี่ยวนำ 3 เฟส</b> ตัวหนึ่งทำงานกลับด้าน: รับไฟ 1 เฟสมาหมุน แล้ว "ป้อนกลับ" ไฟ 3 เฟสออกทางขั้วของมันเอง เรียกว่า <b>Idler Motor</b> (มอเตอร์เปล่า ไม่ต่อโหลด)</p>
<ol class="steps"><li><b>ช่วงสตาร์ท:</b> ไฟ 1 เฟสจ่าย Idler ผ่าน <b>Start Capacitor</b> สร้างแรงบิดหมุนโรเตอร์ขึ้นไปใกล้ความเร็ว synchronous</li>
<li><b>ช่วง Running:</b> โรเตอร์หมุนตัดสนามแม่เหล็ก ขดสเตเตอร์ทั้ง 3 ชุดของ Idler เกิดแรงเคลื่อนเหนี่ยวนำ (คล้ายเจนเนอเรเตอร์) → ได้ไฟ 3 เฟสที่ขั้ว <b>T1-T2-T3</b></li>
<li>ไฟ 3 เฟสส่งผ่านบัสไป <b>เลี้ยงแอร์ 4 ตัวพร้อมกัน (ต่อขนาน)</b></li>
<li>เมื่อแอร์แต่ละตัวเปิด-ปิด (โหลดเปลี่ยน) Idler ปรับสมดุลได้ <b>ดีกว่า Static</b> เพราะมี <b>มวลหมุน (Inertia)</b> ช่วยรักษาความเรียบของคลื่น</li></ol>`)}
${WARN('"Rotor ไปถึงความเร็ว Synchronous"', 'สไลด์หน้า 03 เขียนว่าโรเตอร์ของ Idler หมุน "ไปถึงความเร็ว Synchronous" — มอเตอร์<b>เหนี่ยวนำ</b>หมุน<b>ถึง synchronous พอดีไม่ได้</b> ต้องช้ากว่าเล็กน้อย (มี slip) จึงจะเกิดแรงบิด ข้อสอบถ้าถามให้ตอบว่า "<b>ใกล้</b>ความเร็ว synchronous"')}
${SEC('4. VFD (Inverter) — 3 ขั้น', `<figure class="fig">${VFD_SVG}<figcaption>บล็อกไดอะแกรม VFD จากสไลด์หน้า 05</figcaption></figure>
<p><b>ขั้นที่ 1 — Rectifier Stage (AC → DC):</b> <b>Diode Bridge Rectifier 4 ตัว</b> (1 เฟสเต็มคลื่น) แปลง AC 220 V (<b>Peak ≈ 311 V</b>) เป็น <b>Pulsating DC</b></p>
<p><b>ขั้นที่ 2 — DC Bus (กรองและเก็บพลังงาน):</b> ตัวเก็บประจุขนาดใหญ่ (<b>Electrolytic Capacitor</b>) กรองให้เรียบ (ripple ต่ำ) — ผังมี Capacitor Bank + Inductor</p>
<p><b>ขั้นที่ 3 — Inverter Stage (สร้าง 3 เฟสเทียมด้วย PWM):</b> <b>IGBT 6 ตัว จัดเป็น 3 คู่ (คู่ละ 1 เฟส)</b> สลับเปิด-ปิดเร็วมาก (<b>2–15 kHz</b>) ตามรูปแบบ PWM ปรับความกว้างพัลส์ให้ค่าเฉลี่ยแรงดันเป็นไซน์เทียม (<b>Sinusoidal PWM</b>) ทั้ง 3 เฟส <b>เหลื่อมกัน 120°</b> ทางไฟฟ้า · มี <b>Control board (Microcontroller)</b> สร้างสัญญาณ PWM</p>`)}
${WARN('สูตร DC Bus 1.35 × V<sub>AC</sub> ใช้กับไฟ 1 เฟสไม่ได้', 'สไลด์ขั้นที่ 2 เขียน V<sub>DC</sub> = 1.35 × V<sub>AC,rms</sub> → ไฟเข้า 220 V ได้ ≈ 297 V — <b>1.35 เป็นค่าคงที่ของบริดจ์ 3 เฟส</b> (ใช้กับ V<sub>Line</sub>) แต่ VFD ในสไลด์นี้ใช้<b>บริดจ์ 1 เฟส 4 ไดโอด</b>:<br>• ไม่มีตัวเก็บประจุ: V<sub>dc</sub> = 0.9 × 220 ≈ <b>198 V</b><br>• มีตัวเก็บประจุ (ตามสไลด์): ชาร์จเกือบถึงค่ายอด ≈ √2 × 220 ≈ <b>311 V</b> (ซึ่งหน้าเดียวกันก็เขียน Peak ~311 V)<br>ตัวเลข 297 V บังเอิญอยู่ในช่วงจริง แต่<b>เหตุผลผิดวงจร</b> ถ้าเจอข้อสอบให้แยกให้ออก')}
${SEC('5. สูตรคำนวณ', FOR(`<table class="ftbl">
<tr><td>แรงดันเอาต์พุตสูงสุดของ VFD</td><td>V<sub>out,max</sub> = V<sub>DC</sub>/√2 ≈ <b>0.707 × V<sub>DC</sub></b></td></tr>
<tr><td>สมดุลกำลัง (ไม่มีสูญเสีย)</td><td>P<sub>in</sub> = P<sub>out</sub> → V<sub>1φ</sub>·I<sub>in</sub>·cosφ<sub>in</sub> = √3·V<sub>3φ</sub>·I<sub>out</sub>·cosφ<sub>out</sub></td></tr>
<tr><td>กระแสขาเข้า (คิด η)</td><td>I<sub>in</sub> = (√3·V<sub>3φ</sub>·I<sub>out</sub>·cosφ<sub>out</sub>) / (V<sub>1φ</sub>·cosφ<sub>in</sub>·η)</td></tr>
<tr><td>กำลังไฟ 1 เฟส</td><td>P<sub>1φ</sub> = V × I × cosφ</td></tr>
<tr><td>กำลังไฟ 3 เฟส</td><td>P<sub>3φ</sub> = √3 × V<sub>L</sub> × I<sub>L</sub> × cosφ</td></tr></table>
<small>V<sub>1φ</sub> = แรงดันไฟเข้า 1 เฟส, V<sub>3φ</sub> = V<sub>L</sub> = แรงดันระหว่างสายด้านออก, I = กระแส, cosφ = power factor, η = ประสิทธิภาพ VFD (0–1)</small>`))}
${NOTE('V<sub>out,max</sub> = V<sub>DC</sub>/√2 มาจากไหน', 'ถ้าใช้ PWM แบบ space-vector (หรือ sine + third-harmonic) แรงดันระหว่างสายยอดสูงสุด = V<sub>DC</sub> จึงได้ rms = V<sub>DC</sub>/√2 ≈ 0.707 V<sub>DC</sub> ตามสไลด์ ถ้าเป็น sinusoidal PWM ธรรมดาจะได้ราว 0.612 V<sub>DC</sub> — ในข้อสอบให้ใช้ <b>0.707 ตามสไลด์</b>')}

<ul><li>จำกัด <b>กระแสพุ่งตอนเปิดเครื่อง (inrush current)</b></li><li>ป้องกันแรงดันเอาต์พุต<b>พุ่งเกินค่าตั้ง (overshoot)</b></li><li>ลดความเครียดของอุปกรณ์ เช่น MOSFET ตัวเหนี่ยวนำ ฟิวส์</li></ul>
<p>เปรียบเหมือน <b>เหยียบคันเร่งอย่างนุ่มนวล</b> ไม่ใช่เหยียบจมทันที</p>
${FOR('i<sub>C</sub> = C · dv/dt<br><small>i<sub>C</sub> = กระแสชาร์จตัวเก็บประจุ, C = ความจุ, dv/dt = อัตราการเปลี่ยนแรงดัน</small>', 'หลักการเบื้องหลัง')}
<p>ตัวเก็บประจุดึงกระแส<b>มาก</b>เมื่อแรงดันคร่อมเปลี่ยน<b>เร็ว</b> และดึง<b>น้อย</b>เมื่อเปลี่ยน<b>ช้า</b> → ถ้าคุมให้แรงดันขึ้นช้า ๆ กระแสชาร์จจะต่ำและควบคุมได้</p>`)}
${SEC('2. ไม่มี soft start (วงจร DC-DC) เกิดอะไร', `<p><b>DC-DC converter</b> = วงจรแปลง DC ค่าหนึ่งเป็นอีกค่า เช่น 12 V → 5 V</p>
<ol class="steps"><li>เปิดเครื่อง: <b>V<sub>out</sub> = 0 V</b> แต่ <b>V<sub>ref</sub></b> (ค่าเป้าที่ IC เทียบ) เต็มค่าทันที</li>
<li><b>Error Amplifier</b> เห็นความต่างมหาศาล → สั่งทำงานเต็มกำลัง (<b>duty cycle สูงสุด</b> = สัดส่วนเวลาที่สวิตช์เปิดต่อรอบ)</li>
<li>กระแสในตัวเหนี่ยวนำพุ่งจน<b>ชนขีดจำกัดกระแสของ IC</b></li>
<li><b>C<sub>out</sub></b> ถูกชาร์จด้วยกระแสสูง ใกล้ค่าตั้งแล้วระบบตอบสนองไม่ทัน → <b>overshoot</b></li>
<li>แหล่งจ่าย V<sub>in</sub> ถูกดึงกระแสมาก <b>แรงดันตก อาจรีเซ็ตซ้ำ ๆ</b></li></ol>`)}
${SEC('3. มี soft start ทำงานยังไง', `<p>ทำให้<b>แรงดันอ้างอิงที่ Error Amplifier ใช้เทียบ ค่อย ๆ เพิ่มจาก 0</b> → V<sub>out</sub> ตามขึ้นช้า ๆ ความต่างที่วงจรควบคุมเห็นไม่เคยใหญ่เกิน</p>
<ol class="steps"><li>IC เริ่มเมื่อเงื่อนไขผ่าน: <b>EN (Enable)</b> สั่งเปิด/ปิด IC และ <b>UVLO (Under-Voltage Lockout)</b> ไม่ยอมให้ IC ทำงานถ้า V<sub>in</sub> ต่ำเกิน</li>
<li>แหล่งจ่ายกระแสคงที่ใน IC (<b>I<sub>SS</sub></b>) ชาร์จตัวเก็บประจุ soft start (<b>C<sub>SS</sub></b>) ที่ต่อกับ<b>ขา SS</b> → <b>V<sub>SS</sub> เพิ่มเป็นเส้นตรง</b></li>
<li>Error Amplifier ใช้<b>ค่าที่ต่ำกว่า</b>ระหว่าง V<sub>SS</sub> กับ V<sub>ref</sub> เป็นตัวอ้างอิง</li>
<li>V<sub>out</sub> ไต่ขึ้นตามเส้นลาดของ V<sub>SS</sub></li>
<li>V<sub>SS</sub> สูงเกิน V<sub>ref</sub> → ตัวอ้างอิงจริงรับช่วง soft start จบ</li>
<li>IC ส่ง <b>PG (Power Good)</b> บอกว่า V<sub>out</sub> นิ่งพร้อมใช้</li></ol>
${FOR('กระแสคงที่ชาร์จตัวเก็บประจุ → V<sub>SS</sub>(t) = (I<sub>SS</sub>/C<sub>SS</sub>)·t &nbsp;→ เวลา soft start t<sub>SS</sub> ≈ C<sub>SS</sub>·V<sub>ref</sub>/I<sub>SS</sub><br><small>C<sub>SS</sub> ใหญ่ขึ้น = ramp ช้าลง (soft start นานขึ้น) — ความรู้ประกอบจาก i = C·dv/dt</small>', 'ความชันของ V<sub>SS</sub>')}`)}
${SEC('4. วงจรเป็นอย่างไร', `<p><b>(1) Soft start ของ DC-DC:</b> V<sub>in</sub> → [IC ควบคุม DC-DC] → ตัวเหนี่ยวนำ → V<sub>out</sub> (มี C<sub>out</sub> ลง GND) · ขา SS ของ IC ต่อ <b>C<sub>SS</sub> ภายนอก</b> ลง GND โดยมี I<sub>SS</sub> (แหล่งกระแสภายใน) ชาร์จ แล้วส่งไป Error Amplifier</p>
<pre class="ascii">L1 ─[SCR คู่ขนานสวนทิศ]─┐
L2 ─[SCR คู่ขนานสวนทิศ]─┼──► มอเตอร์ 3 เฟส
L3 ─[SCR คู่ขนานสวนทิศ]─┘
     └ Bypass contactor ขนานคร่อม SCR
ชุดควบคุม: ตรวจจุดข้ามศูนย์ (zero-cross) → ไมโครคอนโทรลเลอร์ → วงจรขับเกต SCR
           + CT วัดกระแส + วงจรป้องกัน</pre>
<p><b>(2) Soft starter มอเตอร์ 3 เฟส:</b> แต่ละเฟสมี <b>SCR 2 ตัวต่อขนานสวนทิศ (anti-parallel)</b> เพื่อคุมได้ทั้งครึ่งบวกและครึ่งลบ · <b>Bypass contactor</b> ขนานคร่อม SCR ดึงเข้าเมื่อมอเตอร์ถึงความเร็วเต็ม (ลดความร้อน SCR) · ชุดควบคุมจับ <b>zero-cross</b> เพื่อคำนวณมุมจุดชนวน</p>`)}
${SEC('5. วิธีตรวจสอบ soft starter', `<ul><li>วัดกระแสสตาร์ทด้วย <b>clamp meter</b> ที่มีฟังก์ชัน <b>inrush / peak hold</b> หรือ power analyzer เทียบกับกระแสพิกัดมอเตอร์ และกับการสตาร์ทตรง (DOL)</li>
<li>ตรวจว่าเวลา <b>ramp</b> ตรงค่าตั้ง และ <b>bypass contactor</b> ดึงเข้าเมื่อถึงความเร็วเต็ม</li><li>ตรวจแรงดัน/กระแส 3 เฟสสมดุล</li><li>ตรวจอุณหภูมิ SCR และ <b>heatsink</b></li><li>ตรวจ <b>soft stop</b> และบันทึกความผิดปกติ (กระแสเกิน เฟสขาด ความร้อนสูง)</li></ul>`)}
${SEC('6. SCR คืออะไร', `<p><b>SCR (Silicon Controlled Rectifier)</b> อุปกรณ์สารกึ่งตัวนำใน<b>ตระกูลไทริสเตอร์ (thyristor)</b> เป็นสวิตช์กำลังที่<b>นำกระแสทางเดียว</b> สั่งเริ่มนำด้วยสัญญาณเล็ก ๆ ที่ขาควบคุม — เปรียบเป็น "<b>ไดโอดที่มีสวิตช์สั่งเริ่มนำ</b>"</p>
<p>จุดเด่น: ทนแรงดัน/กระแส<b>สูงมาก</b> แรงดันตกขณะนำต่ำ <b>~1–2 V</b> · ใช้ใน: เครื่องหรี่ไฟ, คุมฮีตเตอร์, เครื่องเชื่อม, ที่ชาร์จแบต, ไดรฟ์มอเตอร์ DC, soft starter มอเตอร์ AC</p>
<p><b>โครงสร้าง:</b> สารกึ่งตัวนำ <b>4 ชั้น P-N-P-N</b> เกิด<b>รอยต่อ 3 รอย</b> · ขา 3 ขา: <b>Anode (A)</b> ขั้วบวก กระแสเข้า · <b>Cathode (K)</b> ขั้วลบ กระแสออก · <b>Gate (G)</b> ขาควบคุม ส่งพัลส์จุดชนวน</p>`)}
${SEC('7. หลักการทำงานของ SCR', `<ol class="steps"><li>ปกติ SCR <b>ไม่นำ</b> แม้ A บวกกว่า K — จนกว่าจะมี<b>พัลส์สั้น ๆ ที่ Gate</b> = <b>การจุดชนวน (triggering/firing)</b></li>
<li>จุดชนวนแล้ว SCR <b>"ล็อกตัวเอง" (latching)</b> นำต่อได้แม้เอา Gate ออก เพราะภายในเทียบได้กับ<b>ทรานซิสเตอร์ 2 ตัวป้อนกลับเสริมกัน</b></li>
<li>หยุดนำเมื่อกระแสลดต่ำกว่า <b>holding current</b> (กระแสต่ำสุดที่ยังนำต่อได้)</li>
<li>ไฟ <b>AC</b>: คลื่นข้ามศูนย์ทุกครึ่งคาบ → SCR <b>ดับเองตามธรรมชาติ</b> · ไฟ <b>DC</b>: ต้องมี<b>วงจรช่วยดับ (commutation)</b></li>
<li>คุมกำลัง AC ด้วย <b>phase-angle control</b>: จุดชนวน<b>เร็ว → โหลดได้กำลังมาก</b>, จุดชนวน<b>ช้า → กำลังน้อย</b> · มุมที่หน่วงก่อนจุดชนวน = <b>firing angle (α)</b></li></ol>`)}
${TIP('SCR = "<b>ประตูกลอนสปริง</b>" — กดกริ่ง (Gate) ครั้งเดียวประตูเปิดค้าง (latch) จะปิดก็ต่อเมื่อคนเดินผ่านน้อยกว่า holding current หรือไฟ AC ข้ามศูนย์<br><b>α น้อย = เปิดเร็ว = กำลังมาก</b>')}
${SEC('8. เวลา SCR เสีย เช็กอย่างไร', `<p><b>(1) มัลติมิเตอร์</b> (ถอดออกก่อน ดูขาจาก datasheet, โหมดวัดความต้านทาน/ไดโอด)</p>
<table class="tbl"><tr><th>วัด</th><th>ปกติ</th><th>ถ้าผิด</th></tr>
<tr><td>A–K ทั้งสองทิศ</td><td>ไม่นำ (OL = Over Limit)</td><td>นำ = <b>SCR ช็อต</b></td></tr>
<tr><td>A–G ทั้งสองทิศ</td><td>ไม่นำ</td><td>นำ = <b>รอยต่อเสีย</b></td></tr>
<tr><td>G–K</td><td>ค่าต่ำเล็กน้อยคล้ายไดโอด</td><td>ไม่นำเลยทั้งสองทิศ = <b>Gate อาจขาด</b></td></tr></table>
<p><b>(2) ทดสอบจุดชนวนและการล็อก</b> ใช้ DC <b>6–12 V</b> หลอดไฟเล็กเป็นโหลด + ตัวต้านทานจำกัดกระแส Gate</p>
<ol class="steps"><li>จ่ายไฟ → หลอด<b>ต้องไม่ติด</b></li><li>แตะ Gate กับไฟบวกผ่านตัวต้านทาน → หลอด<b>ต้องติด</b></li><li>ถอดสายที่แตะ Gate → หลอด<b>ต้องยังติด</b> (ล็อกได้)</li><li>ตัดกระแสโหลดชั่วขณะ → หลอด<b>ต้องดับ</b> และไม่ติดอีกจนกว่าจะจุดชนวนใหม่</li></ol>`)}
${HOT('• Soft start แก้ inrush + overshoot · หลัก i = C·dv/dt<br>• ขา SS + C<sub>SS</sub> + I<sub>SS</sub> → V<sub>SS</sub> ramp · EA ใช้ค่าต่ำกว่าระหว่าง V<sub>SS</sub>, V<sub>ref</sub> · EN, UVLO, PG<br>• SCR: P-N-P-N 3 รอยต่อ, A-K-G, latch, holding current, firing angle<br>• Soft starter: SCR คู่ขนานสวนทิศต่อเฟส + bypass contactor')}

<div class="chlist">
${CHS.map(c => `<article class="card ch ${c.star ? 'star' : ''}">

</article>`).join('')}
</div>

  function read() {

<div class="readfoot">

  // ----- quiz -----
  let Q = null; // {title, items, i, answers[], streak, best, kind, chId}
  function startQuiz(items, meta) {
    Q = Object.assign({ items, i: 0, answers: [], streak: 0, bestStreak: 0 }, meta);
    go({ name: 'quiz' });
  }
  function quiz() {
    const it = Q.items[Q.i]; const ans = Q.answers[Q.i];
    const ch = byId[it.ch]; const done = ans !== undefined;
    const correctN = Q.answers.filter((a, k) => a !== undefined && Q.items[k].opts[a].ok).length;
    let exp = '';
    if (done) {
      const ok = it.opts[ans].ok; const right = it.opts.find(o => o.ok);
      exp = `<div class="explain"><div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? '✓ ถูกต้อง!' : '✗ ยังไม่ใช่'} — คำตอบคือ “${right.t}”</div>
<div><b>ทำไมถูก:</b> ${right.why}</div>
<ul>${it.opts.filter(o => !o.ok).map(o => `<li><span class="o">✗ ${o.t}</span> — ${o.why}</li>`).join('')}</ul></div>`;
    }
    return `<div class="wrap">
<div class="qtop"><button class="btn sm" data-act="quitquiz">✕ ออก</button><span class="lab">${Q.title}</span><span class="sp"></span>
<span class="streak ${Q.streak >= 2 ? 'on' : ''}" id="streak">🔥 ติดกัน ${Q.streak}</span><span class="lab">✓ ${correctN}</span></div>
<div class="pbar"><i style="width:${pct(Q.i + (done ? 1 : 0), Q.items.length)}%"></i></div>
<div class="card qcard" id="qcard">
  <div class="qmeta"><span class="chip">ข้อ ${Q.i + 1} / ${Q.items.length}</span><span class="chip">${pad(ch.no)} ${ch.title}</span>${it.calc ? '<span class="bdg sky">🧮 คำนวณ</span>' : ''}</div>
  <div class="qtext">${it.q}</div>
  <div class="opts ${done ? 'done' : ''}">
  ${it.opts.map((o, k) => { let cls = ''; if (done) { if (o.ok) cls = 'ok'; else if (k === ans) cls = 'bad'; else cls = 'dim'; } return `<button class="opt ${cls}" data-ans="${k}" ${done ? 'aria-disabled="true"' : ''}><span class="k">${'ABCD'[k]}</span><span>${o.t}</span></button>`; }).join('')}
  </div>${exp}
</div>
<div class="qnav"><span class="kbd">คีย์ลัด: 1–4 หรือ A–D เลือกคำตอบ · Enter ไปข้อถัดไป</span>
<button class="btn pri" data-act="next" ${done ? '' : 'disabled'}>${Q.i + 1 < Q.items.length ? 'ข้อถัดไป →' : 'ดูสรุปผล 🎉'}</button></div></div>`;
  }
  function answer(k, el) {
    if (Q.answers[Q.i] !== undefined) return;
    Q.answers[Q.i] = k; const ok = Q.items[Q.i].opts[k].ok;
    Q.streak = ok ? Q.streak + 1 : 0; Q.bestStreak = Math.max(Q.bestStreak, Q.streak);
    const rect = el && el.getBoundingClientRect();
    render();
    const card = $('#qcard'); card.classList.add(ok ? 'pop' : 'shake');
    if (ok) { sparkle(rect); const s = $('#streak'); s.classList.add('bump'); setTimeout(() => s.classList.remove('bump'), 250); }
    const btn = $('[data-act="next"]'); if (btn) btn.focus({ preventScroll: true });

  }
  function sparkle(rect) {
    if (!rect || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const em = ['✨', '⭐', '💙', '🎉', '✦'];
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span'); s.className = 'spark'; s.textContent = em[i % em.length];
      s.style.left = (rect.left + rect.width * (0.2 + Math.random() * 0.6)) + 'px'; s.style.top = (rect.top + rect.height / 2) + 'px';
      s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); s.style.setProperty('--dy', (-40 - Math.random() * 90) + 'px'); s.style.setProperty('--rot', (Math.random() * 240 - 120) + 'deg');
      document.body.appendChild(s); setTimeout(() => s.remove(), 950);
    }
  }
  function nextQ() {
    if (Q.answers[Q.i] === undefined) return;
    if (Q.i + 1 < Q.items.length) { Q.i++; render(); window.scrollTo({ top: 0 }); }
    else finishQuiz();
  }
  function finishQuiz() {
    const c = Q.answers.filter((a, k) => Q.items[k].opts[a].ok).length, t = Q.items.length;

    const per = {}; Q.items.forEach((it, k) => { per[it.ch] = per[it.ch] || [0, 0]; per[it.ch][1]++; if (it.opts[Q.answers[k]].ok) per[it.ch][0]++; });
    const wrong = Q.items.map((it, k) => ({ it, a: Q.answers[k] })).filter(x => !x.it.opts[x.a].ok);
    const msg = p >= 85 ? 'เยี่ยมมาก พร้อมสอบแล้ว 🎉' : p >= 70 ? 'ดีมาก ทบทวนข้อที่ผิดอีกนิด 💪' : p >= 50 ? 'ผ่านครึ่งแล้ว กลับไปอ่านบทที่คะแนนต่ำ 📖' : 'ลองอ่านสรุปแต่ละบทก่อน แล้วค่อยกลับมาใหม่นะ 🌱';
    return `<div class="wrap">

<div style="height:40px"></div></div>`;
  }

  // ----- written -----
  let W = { filter: 'all', open: {}, check: {}, random: null };
  function wid(c, k) { return c.id + '#' + k; }
  function allWritten() { const out = []; CHS.forEach(c => c.written.forEach((w, k) => out.push({ c, w, id: wid(c, k) }))); return out; }
  function written() {

    else if (W.filter !== 'all') list = list.filter(x => x.c.id === W.filter);
    return `<div class="wrap">

<div class="readhead"><h1>✍️ ฝึกข้อเขียน</h1><div class="en">พิมพ์คำตอบ (บันทึกอัตโนมัติ) → กด "ตรวจคีย์เวิร์ด" ดูว่าใส่คำสำคัญครบไหม → เทียบ "แนวคำตอบ"</div></div>

${chk ? `<div class="kwc">${w.kw.map(([lab, alts]) => `<span class="kw ${hit(txt, alts) ? 'hit' : ''}">${hit(txt, alts) ? '✓' : '○'} ${lab}</span>`).join('')}</div><div class="kbd mt" style="margin-top:6px">ใส่แล้ว ${w.kw.filter(([, a]) => hit(txt, a)).length}/${w.kw.length} คีย์เวิร์ด (ตรวจจากคำในข้อความ อาจต้องใช้คำตามสไลด์/อังกฤษ)</div>` : ''}
${W.open[id] ? `<div class="model"><div class="h">แนวคำตอบที่ได้คะแนนเต็ม</div>${w.ans}</div>` : ''}
</div>`; }).join('')}
<div style="height:40px"></div></div>`;
  }

  function randomWritten() {

    if (d.fch) { F = { ch: d.fch, order: null, flipped: {} }; render(); return; }
    if (d.card !== undefined) { const i = +d.card; F.flipped[i] = !F.flipped[i]; t.classList.toggle('flip'); return; }
    switch (d.act) {
      case 'home': go({ name: 'home' }); break;
      case 'mock': { const m = +d.n; startQuiz(buildMock(m), { title: m === 2 ? 'จำลองสอบเต็ม 120 ข้อ (2 ชุด)' : 'จำลองสอบ 60 ข้อ', kind: 'mock', mult: m }); break; }
      case 'written': W.random = null; go({ name: 'written' }); break;
      case 'wrandom': W.random = randomWritten(); go({ name: 'written' }); break;
      case 'wall': W.random = null; render(); break;
      case 'warns': go({ name: 'warns' }); break;
      case 'readdone': st.read[d.id] = 1; save(); { const c = byId[d.id]; startQuiz(buildChapterQuiz(c), { title: `แบบทดสอบบท ${pad(c.no)}: ${c.title}`, kind: 'chapter', chId: c.id }); } break;
      case 'next': nextQ(); break;
      case 'quitquiz': if (Q.answers.length === 0 || confirmQuit()) go({ name: 'home' }); break;
      case 'retrywrong': { const items = Q.items.filter((it, k) => !it.opts[Q.answers[k]].ok).map(it => Object.assign({}, it, { opts: shuffle(it.opts) })); startQuiz(shuffle(items), { title: 'ทบทวนข้อที่ผิด', kind: 'retry' }); break; }
      case 'again': { if (Q.kind === 'chapter') { const c = byId[Q.chId]; startQuiz(buildChapterQuiz(c), { title: Q.title, kind: 'chapter', chId: c.id }); } else if (Q.kind === 'mock') startQuiz(buildMock(Q.mult || 1), { title: Q.title, kind: 'mock', mult: Q.mult }); else startQuiz(shuffle(Q.items.map(it => Object.assign({}, it, { opts: shuffle(it.opts) }))), { title: Q.title, kind: 'retry' }); break; }
      case 'flipall': { const c = byId[F.ch] || CHS[0]; const allOn = c.cards.every((_, i) => F.flipped[i]); c.cards.forEach((_, i) => F.flipped[i] = !allOn); render(); break; }
      case 'shufcards': { const c = byId[F.ch] || CHS[0]; F.ch = c.id; F.order = shuffle(c.cards.map((_, i) => i)); F.flipped = {}; render(); break; }
      case 'reset': if (resetOK()) { st.scores = {}; st.mock = {}; st.read = {}; save(); render(); } break;
    }
  });
  // ยืนยันด้วย UI ภายในหน้า (ไม่ใช้ confirm() ของเบราว์เซอร์)
  let quitArmed = 0, resetArmed = 0;
  function confirmQuit() { const b = $('[data-act="quitquiz"]'); if (Date.now() - quitArmed < 3000) return true; quitArmed = Date.now(); b.textContent = 'กดอีกครั้งเพื่อออก'; setTimeout(() => { if (b.isConnected) b.textContent = '✕ ออก'; }, 3000); return false; }
  function resetOK() { const b = $('[data-act="reset"]'); if (Date.now() - resetArmed < 3000) return true; resetArmed = Date.now(); b.textContent = 'กดอีกครั้งเพื่อยืนยันล้าง'; setTimeout(() => { if (b.isConnected) b.textContent = 'ล้างคะแนน'; }, 3000); return false; }

  let saveT = null;
  app.addEventListener('input', e => {
    const id = e.target.dataset.wta; if (!id) return;
    st.written[id] = e.target.value; clearTimeout(saveT);
    const s = $(`[data-wsaved="${id}"]`); if (s) s.textContent = 'กำลังบันทึก...';
    saveT = setTimeout(() => { save(); if (s) s.textContent = 'บันทึกแล้ว ✓'; if (W.check[id]) refreshKw(id); }, 400);
  });
  function refreshKw(id) {
    const [cid, k] = id.split('#'); const w = byId[cid].written[+k]; const box = $(`[data-wq="${id}"] .kwc`); if (!box) return;
    const txt = st.written[id] || '';
    box.innerHTML = w.kw.map(([lab, alts]) => `<span class="kw ${hit(txt, alts) ? 'hit' : ''}">${hit(txt, alts) ? '✓' : '○'} ${lab}</span>`).join('');
    const n = box.nextElementSibling; if (n) n.textContent = `ใส่แล้ว ${w.kw.filter(([, a]) => hit(txt, a)).length}/${w.kw.length} คีย์เวิร์ด (ตรวจจากคำในข้อความ อาจต้องใช้คำตามสไลด์/อังกฤษ)`;
  }
  document.addEventListener('keydown', e => {
    if (view.name !== 'quiz' || e.target.tagName === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase(); const map = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 };
    if (k in map && Q.items[Q.i].opts[map[k]]) { e.preventDefault(); answer(map[k], app.querySelectorAll('.opt')[map[k]]); }
    else if (k === 'enter' && Q.answers[Q.i] !== undefined) { e.preventDefault(); nextQ(); }
  });
  $('#themeBtn').addEventListener('click', () => { const cur = document.documentElement.dataset.theme; st.theme = cur === 'dark' ? 'light' : 'dark'; save(); applyTheme(); });
  $('#homeBtn').addEventListener('click', () => go({ name: 'home' }));
  matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!st.theme) applyTheme(); });

  render();
  window.__EE2 = { CHS, buildMock, materialize, TOTAL_Q }; // ใช้ทดสอบ
})();

</script>
